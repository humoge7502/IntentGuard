name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check intentguard tests scripts

      - name: Test suite (unit / integration / security / tenant isolation)
        working-directory: backend
        run: pytest tests/ -q --ignore=tests/test_attackbench.py

      - name: AttackBench regression gate
        working-directory: backend
        run: pytest tests/test_attackbench.py -q

      - name: Firewall latency smoke (fails only on catastrophic regression)
        working-directory: backend
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, ".")
          sys.path.insert(0, "scripts")
          from bench_firewall import bench
          result = bench(300)
          assert result["p95_ms"] < 250, f"p95 {result['p95_ms']}ms — catastrophic regression"
          print(f"latency smoke OK: p50={result['p50_ms']}ms p95={result['p95_ms']}ms")
          EOF

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: pip install -e .
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit environment for known vulnerabilities
        working-directory: backend
        run: pip-audit

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t intentguard:ci .
      - name: Smoke run
        run: |
          docker run -d --name ig -p 8400:8400 intentguard:ci
          sleep 5
          curl -fsS http://127.0.0.1:8400/health
          docker logs ig 2>&1 | grep "Admin API key"
