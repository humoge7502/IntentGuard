# Alembic configuration for IntentGuard.
#
# The database URL is resolved in alembic/env.py from INTENTGUARD_MIGRATION_DB
# (falling back to INTENTGUARD_DATABASE_URL, then the default SQLite path) so
# the same migrations drive SQLite and PostgreSQL deployments.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
